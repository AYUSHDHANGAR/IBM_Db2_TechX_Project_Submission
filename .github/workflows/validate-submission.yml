name: Validate Project Submission

on:
  pull_request:
    branches: [main]
    paths:
      - 'submissions/**'
      - '.github/workflows/validate-submission.yml'
      - 'scripts/**'

jobs:
  validate:
    name: Validate Submission Structure & Metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Submission Validator
        run: |
          python scripts/validate_submission.py
