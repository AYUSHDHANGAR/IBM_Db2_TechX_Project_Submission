name: 🐛 Repository / Validation Bug Report
description: Report an issue or bug with the repository templates, scripts, or automated CI validation.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template only if you encounter a bug with the repository templates, CI workflows, or validation scripts.
  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: Clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Run `python scripts/validate_submission.py ...`
        2. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
